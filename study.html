    <script>
(function(){
  function showPw(){
    var e = document.getElementById("entry-screen");
    var p = document.getElementById("password-screen");
    var i = document.getElementById("pw-input");
    if (e && e.style.display !== "none") {
      e.style.display = "none";
      if (p) p.style.display = "flex";
      setTimeout(function(){ if (i) i.focus(); }, 40);
    }
  }

  function unlock(){
    var e = document.getElementById("entry-screen");
    var p = document.getElementById("password-screen");
    if (e) e.style.display = "none";
    if (p) p.style.display = "none";
    try { sessionStorage.setItem("_younis_auth", "1"); } catch(err){}
  }

  window.verifyYounisPw = function(evt){
    if (evt && evt.preventDefault) evt.preventDefault();
    var inp = document.getElementById("pw-input");
    var msg = document.getElementById("pw-msg");
    var val = (inp ? inp.value : "").trim();
    if (val === "7081") {
      unlock();
    } else {
      if (msg) msg.textContent = "Incorrect password.";
      if (inp) { inp.value = ""; inp.focus(); }
    }
    return false;
  };

  try {
    if (sessionStorage.getItem("_younis_auth") === "1") {
      unlock();
    }
  } catch(err){}

  window.addEventListener("DOMContentLoaded", function(){
    var e = document.getElementById("entry-screen");
    if (e) {
      e.addEventListener("click", showPw);
      e.addEventListener("pointerdown", showPw);
      e.addEventListener("touchstart", showPw, { passive: true });
    }
  });

  window.addEventListener("click", function(){
    var e = document.getElementById("entry-screen");
    if (e && e.style.display !== "none") showPw();
  });

  window.addEventListener("keydown", function(ev){
    var e = document.getElementById("entry-screen");
    if (e && e.style.display !== "none") {
      showPw();
    }
    if (ev.key === "F11" || (ev.altKey && ev.key.toLowerCase() === "f")) {
      ev.preventDefault();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function(){});
      } else {
        document.exitFullscreen().catch(function(){});
      }
    }
  });
})();
    </script>
